# Nome do workflow que será exibido no GitHub Actions
name: Workflow AWS - Pipeline CI/CD

# Evento que dispara a execução do workflow
on:
  push:
    branches:
      - main

jobs:

  # Primeiro trabalho: build do projeto
  build:
    name: Build do projeto Java 25
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      # Build sem testes
      - name: Build da aplicação sem testes
        run: ./mvnw clean package -DskipTests

      - name: Mensagem de build concluído
        run: echo "Build do projeto Java 25 com Spring Boot concluído com sucesso."

      # Salva o JAR para ser utilizado posteriormente no deploy
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: target/*.jar


  # Segundo trabalho: execução dos testes
  test:
    name: Testes da aplicação
    runs-on: ubuntu-latest

    # Só executa se o build terminar com sucesso
    needs: build

    steps:

      # Cada job possui uma máquina virtual nova,
      # então precisamos baixar novamente o código
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      # Executa os testes do projeto Spring Boot
      - name: Executar testes
        run: ./mvnw test

      - name: Mensagem de testes concluídos
        run: echo "Todos os testes foram executados com sucesso."


  # Terceiro trabalho: deploy do projeto
  deploy:
    name: Deploy na AWS
    runs-on: ubuntu-latest

    # Deploy só acontece se os testes terminarem com sucesso
    needs: test

    steps:

      - name: Descrição
        run: echo "Implantando a aplicação em produção."

      # O artefato criado no job build continua disponível
      # mesmo que o deploy dependa diretamente do job test
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-file

      - name: Listar artefatos baixados
        run: ls -la

      - name: Renomear arquivo JAR
        run: |
          JAR_FILE=$(ls *.jar)
          echo "Arquivo JAR baixado: $JAR_FILE"
          mv "$JAR_FILE" api-java-clientes.jar

      - name: Fazer deploy no Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: api-java-clientes
          environment_name: Api-java-clientes-env
          region: us-east-2
          deployment_package: api-solicitacoes.jar
          version_label: ${{ github.sha }}

      - name: Limpar arquivos temporários
        run: rm -f *.jar
